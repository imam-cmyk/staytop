<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StayTop</title>
<style>
  :root {
    --accent: #5856d6;
    --bg: #f2f2f7;
    --panel: rgba(255,255,255,0.72);
    --panel-solid: #ffffff;
    --text: #1c1c1e;
    --text2: rgba(60,60,67,0.6);
    --text3: rgba(60,60,67,0.33);
    --hairline: rgba(0,0,0,0.08);
    --field: rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --panel: rgba(28,28,30,0.72);
      --panel-solid: #1c1c1e;
      --text: #f2f2f7;
      --text2: rgba(235,235,245,0.6);
      --text3: rgba(235,235,245,0.3);
      --hairline: rgba(255,255,255,0.1);
      --field: rgba(255,255,255,0.08);
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: Verdana, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    overscroll-behavior: none;
  }
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 60%),
      radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      var(--bg);
    transition: background 0.4s;
  }
  #app {
    position: relative; z-index: 1;
    min-height: 100%;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px);
    max-width: 640px; margin: 0 auto;
  }

  /* Header */
  header {
    display:flex; align-items:center; gap:6px;
    padding: 8px 12px 6px;
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .list-pill {
    display:flex; align-items:center; gap:7px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 16px; padding: 5px 11px;
    font-weight: bold; font-size: 13px; color: var(--text);
    max-width: 55%;
  }
  .list-pill .dot { width:10px; height:10px; border-radius:50%; background: var(--accent); flex:none; }
  .list-pill .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-pill .chev { color: var(--text2); font-size: 10px; }
  .spacer { flex:1; }
  .count-badge {
    font-size: 11px; color: var(--text2);
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    border-radius: 12px; padding: 4px 9px; white-space:nowrap;
  }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--panel); border: 1px solid var(--hairline);
    color: var(--text2); font-size: 16px; flex: none;
  }
  .icon-btn.active { color: #fff; background: var(--accent); border-color: transparent; }
  button, input { font-family: inherit; border:none; background:none; color:inherit; font-size:inherit; }
  button { cursor:pointer; }

  /* Sync dot */
  .sync-dot { width:7px; height:7px; border-radius:50%; background: var(--text3); margin-left: 2px; flex:none; }
  .sync-dot.ok { background: #34c759; }
  .sync-dot.err { background: #ff3b30; }
  .sync-dot.busy { background: #ff9f0a; }

  /* Input */
  .add-row {
    display:flex; align-items:center; gap:8px;
    margin: 2px 12px 6px;
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 11px; padding: 7px 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .add-row .plus { color: var(--text2); font-size: 16px; font-weight:bold; }
  .add-row input { flex:1; outline:none; font-size: 14px; background:transparent; }
  .add-row input::placeholder { color: var(--text3); }

  /* Task list */
  #tasks { padding: 0 10px; }
  .task {
    display:flex; align-items:center; gap:7px;
    padding: 3px 8px; margin: 0;
    border-radius: 8px; border: 1px solid transparent;
    position: relative;
  }
  .task.selected { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .task .check {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1.5px solid var(--text3); flex:none;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:11px;
  }
  .task.done .check { background: var(--accent); border-color: var(--accent); }
  .task .txt { flex:1; font-size: 15px; word-break: break-word; }
  .task.done .txt { color: var(--text2); text-decoration: line-through; }
  .task .txt input {
    width: 100%; outline: none; background: transparent;
    font: inherit; color: var(--text);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
    padding-bottom: 2px;
  }
  .sect {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: bold; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--accent);
    padding: 12px 10px 3px;
  }
  .sect::after { content: ''; flex: 1; height: 1px; background: color-mix(in srgb, var(--accent) 30%, transparent); }
  .empty {
    text-align:center; color: var(--text3);
    padding: 60px 20px; font-size: 13px;
  }
  .empty .big { font-size: 34px; margin-bottom: 10px; opacity: 0.7; }
  .empty button { color: var(--accent); font-size: 13px; margin-top: 8px; }

  .footer-actions { text-align:right; padding: 8px 20px; }
  .footer-actions button { color: var(--text2); font-size: 12px; }

  /* Format strip */
  #strip {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 14px);
    z-index: 20;
    display: none; align-items: center; gap: 2px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    border: 1px solid var(--hairline);
    border-radius: 26px; padding: 7px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  #strip.show { display:flex; }
  .strip-btn {
    width: 38px; height: 34px; border-radius: 9px;
    display:flex; align-items:center; justify-content:center;
    font-size: 15px; color: var(--text2);
  }
  .strip-btn.on { background: var(--accent); color: #fff; }
  .strip-btn b, .strip-btn i, .strip-btn s, .strip-btn u { font-size: 15px; font-family: Georgia, serif; }
  .strip-sep { width:1px; height:18px; background: var(--hairline); margin: 0 4px; }
  .hl-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--hairline); }

  /* Sheets (bottom menus) */
  #overlay {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,0.35); display:none;
  }
  #overlay.show { display:block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
    max-width: 640px; margin: 0 auto;
    background: var(--panel-solid);
    border-radius: 18px 18px 0 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform: translateY(105%); transition: transform 0.22s ease-out;
    max-height: 78vh; overflow-y: auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet h3 { font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; padding: 10px 4px; }
  .sheet .row {
    display:flex; align-items:center; gap:10px; width: 100%;
    padding: 13px 6px; font-size: 15px; text-align:left;
    border-bottom: 1px solid var(--hairline); color: var(--text);
  }
  .sheet .row:last-child { border-bottom:none; }
  .sheet .row .dot { width: 12px; height: 12px; border-radius: 50%; flex:none; }
  .sheet .row .tick { margin-left:auto; color: var(--accent); font-weight:bold; }
  .sheet .row.danger { color: #ff3b30; }
  .sheet .row.subtle { color: var(--text2); font-size: 14px; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--text3); margin: 4px auto 6px; }

  /* List editor */
  .sheet input.field {
    width: 100%; background: var(--field); border-radius: 10px;
    padding: 12px; font-size: 15px; outline:none; margin: 6px 0 14px;
  }
  .swatches { display:flex; gap: 12px; flex-wrap: wrap; padding: 4px 2px 14px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; }
  .swatch.sel { border-color: var(--text); }
  .seg { display:flex; background: var(--field); border-radius: 10px; padding: 3px; margin-bottom: 16px; }
  .seg button { flex:1; padding: 8px 0; border-radius: 8px; font-size: 13px; color: var(--text2); }
  .seg button.sel { background: var(--accent); color:#fff; }
  .sheet-actions { display:flex; gap: 10px; margin-top: 6px; }
  .sheet-actions button {
    flex:1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: bold;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-plain { background: var(--field); color: var(--text); }
  .btn-danger { background: rgba(255,59,48,0.12); color: #ff3b30; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header>
    <button class="list-pill" onclick="openSheet('lists')">
      <span class="dot" id="pill-dot"></span>
      <span class="name" id="pill-name">Tasks</span>
      <span class="chev">▼</span>
    </button>
    <div class="spacer"></div>
    <span class="count-badge" id="count" style="display:none"></span>
    <button class="icon-btn" id="filter-btn" onclick="openSheet('filter')" title="Filter">⧩</button>
    <button class="icon-btn" onclick="openSheet('settings')" title="Sync">⇅<span class="sync-dot" id="sync-dot"></span></button>
  </header>

  <form class="add-row" id="add-form">
    <span class="plus">＋</span>
    <input id="new-task" placeholder="Add a task…" autocomplete="off" enterkeyhint="done">
  </form>

  <div id="tasks"></div>
  <div class="footer-actions" id="footer" style="display:none">
    <button onclick="clearDone()">Clear done</button>
  </div>
</div>

<!-- Format strip -->
<div id="strip">
  <button class="strip-btn" onclick="openSheet('size')" title="Size">Aa</button>
  <span class="strip-sep"></span>
  <button class="strip-btn" id="fb" onclick="toggleFmt('bold')"><b>B</b></button>
  <button class="strip-btn" id="fi" onclick="toggleFmt('italic')"><i>I</i></button>
  <button class="strip-btn" id="fs" onclick="toggleFmt('strike')"><s>S</s></button>
  <button class="strip-btn" id="fu" onclick="toggleFmt('underline')"><u>U</u></button>
  <span class="strip-sep"></span>
  <button class="strip-btn" onclick="openSheet('highlight')"><span class="hl-dot" id="hl-ind"></span></button>
  <span class="strip-sep"></span>
  <button class="strip-btn" onclick="startEdit(selectedTaskID)">✎</button>
  <button class="strip-btn" onclick="deleteSelected()">🗑</button>
  <button class="strip-btn" onclick="deselect()">✕</button>
</div>

<div id="overlay" onclick="closeSheets()"></div>
<div class="sheet" id="sheet-lists"></div>
<div class="sheet" id="sheet-filter"></div>
<div class="sheet" id="sheet-size"></div>
<div class="sheet" id="sheet-highlight"></div>
<div class="sheet" id="sheet-editor"></div>
<div class="sheet" id="sheet-settings"></div>
<div class="sheet" id="sheet-confirm"></div>

<script>
// ---------- constants ----------
const LIST_COLORS = {
  Indigo:'#5856d6', Blue:'#0a84ff', Teal:'#30b0c7', Mint:'#00c7be',
  Green:'#34c759', Orange:'#ff9f0a', Pink:'#ff2d55', Purple:'#af52de',
};
const HL_COLORS = {
  Yellow:'#ffd60a', Orange:'#ff9f0a', Pink:'#ff375f', Purple:'#bf5af2',
  Blue:'#0a84ff', Teal:'#40c8e0', Green:'#30d158', Gray:'#98989d',
};
const SIZES = [['Small',10],['Normal',12],['Large',15],['X-Large',18]];
const now = () => Date.now();
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : ('xxxx-4xxx'.replace(/x/g,()=>((Math.random()*16)|0).toString(16)))).toUpperCase();

// ---------- state ----------
let state = load('staytop.state') || { lists: [], tombstones: {} };
let ui = load('staytop.ui') || { selectedListID: null, filter: null };
let rev = parseInt(localStorage.getItem('staytop.rev') || '0', 10);
let syncURL = localStorage.getItem('staytop.syncURL') || '';
let selectedTaskID = null, editingTaskID = null;
let dirty = false, syncing = false, lastSyncMsg = 'Not synced yet';

function load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function persist(){
  localStorage.setItem('staytop.state', JSON.stringify(state));
  localStorage.setItem('staytop.ui', JSON.stringify(ui));
  localStorage.setItem('staytop.rev', String(rev));
}

if (!state.lists.length) {
  state.lists = [{ id: uuid(), name: 'Tasks', color: 'Indigo', todos: [], updatedAt: now() }];
}
if (!state.tombstones) state.tombstones = {};
if (!ui.selectedListID || !state.lists.some(l => l.id === ui.selectedListID)) {
  ui.selectedListID = state.lists[0].id;
}

const curList = () => state.lists.find(l => l.id === ui.selectedListID) || state.lists[0];
const curTask = () => (curList().todos || []).find(t => t.id === selectedTaskID);
const listAccent = l => LIST_COLORS[l.color] || LIST_COLORS.Indigo;

function touch(){ dirty = true; persist(); render(); schedulePush(); }

// ---------- rendering ----------
function esc(s){ const d = document.createElement('span'); d.textContent = s; return d.innerHTML; }

function render() {
  const list = curList();
  document.documentElement.style.setProperty('--accent', listAccent(list));
  document.getElementById('pill-dot').style.background = listAccent(list);
  document.getElementById('pill-name').textContent = list.name;

  const todos = list.todos || [];
  const remaining = todos.filter(t => !t.done && !t.section).length;
  const badge = document.getElementById('count');
  badge.style.display = todos.length ? '' : 'none';
  badge.textContent = remaining + ' left';

  const fbtn = document.getElementById('filter-btn');
  fbtn.classList.toggle('active', !!ui.filter);
  if (ui.filter) fbtn.style.background = HL_COLORS[ui.filter];
  else fbtn.style.background = '';

  const visible = todos.filter(t => !ui.filter || t.highlight === ui.filter);
  const wrap = document.getElementById('tasks');

  if (!todos.length) {
    wrap.innerHTML = '<div class="empty"><div class="big">✓</div>All clear</div>';
  } else if (!visible.length) {
    wrap.innerHTML = '<div class="empty"><div class="big">⧩</div>No ' + esc((ui.filter||'').toLowerCase()) +
      ' tasks<br><button onclick="setFilter(null)">Show all</button></div>';
  } else {
    wrap.innerHTML = visible.map(t => {
      if (t.section) {
        return '<div class="sect">' + esc(t.text) + '</div>';
      }
      const listSize = list.size || 12;
      const fs = (t.size || listSize) + 1; // web renders slightly larger for touch
      let style = 'font-size:' + fs + 'px;';
      if (t.bold) style += 'font-weight:bold;';
      if (t.italic) style += 'font-style:italic;';
      const deco = [];
      if (t.done || t.strike) deco.push('line-through');
      if (t.underline) deco.push('underline');
      if (deco.length) style += 'text-decoration:' + deco.join(' ') + ';';
      const hl = t.highlight && HL_COLORS[t.highlight]
        ? 'background:color-mix(in srgb, ' + HL_COLORS[t.highlight] + ' 22%, transparent);' : '';
      const sel = t.id === selectedTaskID ? ' selected' : '';
      const done = t.done ? ' done' : '';
      const body = t.id === editingTaskID
        ? '<input id="edit-field" value="' + esc(t.text).replace(/"/g,'&quot;') + '" style="' + style + '">'
        : '<span style="' + style + '">' + esc(t.text) + '</span>';
      return '<div class="task' + sel + done + '" style="' + hl + '" data-id="' + t.id + '">' +
        '<button class="check" onclick="toggleDone(\'' + t.id + '\');event.stopPropagation()">' + (t.done ? '✓' : '') + '</button>' +
        '<div class="txt">' + body + '</div></div>';
    }).join('');

    wrap.querySelectorAll('.task').forEach(el => {
      el.addEventListener('click', e => {
        const id = el.dataset.id;
        if (editingTaskID && editingTaskID !== id) commitEdit();
        if (editingTaskID === id) return;
        selectedTaskID = (selectedTaskID === id) ? null : id;
        render();
      });
    });
    const ef = document.getElementById('edit-field');
    if (ef) {
      ef.focus();
      ef.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); enterAndContinue(); }
        if (e.key === 'Escape') { editingTaskID = null; render(); }
      });
      ef.addEventListener('click', e => e.stopPropagation());
    }
  }

  document.getElementById('footer').style.display = todos.some(t => t.done) ? '' : 'none';

  // strip
  const strip = document.getElementById('strip');
  const t = curTask();
  strip.classList.toggle('show', !!t);
  if (t) {
    document.getElementById('fb').classList.toggle('on', !!t.bold);
    document.getElementById('fi').classList.toggle('on', !!t.italic);
    document.getElementById('fs').classList.toggle('on', !!t.strike);
    document.getElementById('fu').classList.toggle('on', !!t.underline);
    document.getElementById('hl-ind').style.background = t.highlight ? HL_COLORS[t.highlight] : 'transparent';
  }
  document.getElementById('sync-dot').className = 'sync-dot ' +
    (syncMode() === 'off' ? '' : needsPassphrase ? 'err' : syncing ? 'busy' : (lastSyncMsg.startsWith('Error') ? 'err' : 'ok'));
}

// ---------- task actions ----------
document.getElementById('add-form').addEventListener('submit', e => {
  e.preventDefault();
  const el = document.getElementById('new-task'), text = el.value.trim();
  if (!text) { el.blur(); return; }
  const l = curList();
  l.todos = l.todos || [];
  l.todos.push({ id: uuid(), text, done: false, updatedAt: now() });
  el.value = '';
  el.focus();
  touch();
});

function toggleDone(id) {
  const t = curList().todos.find(t => t.id === id);
  if (t) { t.done = !t.done; t.updatedAt = now(); touch(); }
}
function toggleFmt(key) {
  const t = curTask();
  if (t) { t[key] = !t[key]; t.updatedAt = now(); touch(); }
}
function setTaskSize(pts) {
  const t = curTask();
  if (t) { t.size = pts; t.updatedAt = now(); }
  closeSheets(); touch();
}
function setHighlight(name) {
  const t = curTask();
  if (t) { t.highlight = name || undefined; t.updatedAt = now(); }
  closeSheets(); touch();
}
function deleteSelected() {
  if (!selectedTaskID) return;
  const l = curList();
  state.tombstones[selectedTaskID] = now();
  l.todos = l.todos.filter(t => t.id !== selectedTaskID);
  selectedTaskID = null; editingTaskID = null;
  touch();
}
function deselect(){ commitEdit(); selectedTaskID = null; render(); }
function startEdit(id) {
  if (!id) return;
  editingTaskID = id; selectedTaskID = id;
  render();
}
function commitEdit() {
  if (!editingTaskID) return;
  const ef = document.getElementById('edit-field');
  const l = curList();
  const t = l.todos.find(t => t.id === editingTaskID);
  if (t && ef) {
    const v = ef.value.trim();
    if (v) { if (v !== t.text) { t.text = v; t.updatedAt = now(); dirty = true; } }
    else if (!t.text) {
      state.tombstones[t.id] = now();
      l.todos = l.todos.filter(x => x.id !== t.id);
      if (selectedTaskID === editingTaskID) selectedTaskID = null;
      dirty = true;
    }
  }
  editingTaskID = null;
  persist(); render(); if (dirty) schedulePush();
}
function enterAndContinue() {
  const l = curList();
  const prev = l.todos.find(t => t.id === editingTaskID);
  const prevSize = prev ? prev.size : undefined;
  const ef = document.getElementById('edit-field');
  const hadText = ef && ef.value.trim();
  commitEdit();
  if (!hadText) return;
  const idx = l.todos.findIndex(t => t.id === (prev && prev.id));
  const t = { id: uuid(), text: '', done: false, size: prevSize, updatedAt: now() };
  l.todos.splice(idx + 1, 0, t);
  editingTaskID = t.id; selectedTaskID = t.id;
  touch();
}
function clearDone() {
  const l = curList();
  l.todos.filter(t => t.done).forEach(t => state.tombstones[t.id] = now());
  l.todos = l.todos.filter(t => !t.done);
  if (selectedTaskID && !l.todos.some(t => t.id === selectedTaskID)) selectedTaskID = null;
  touch();
}
function setFilter(name){ ui.filter = name; closeSheets(); persist(); render(); }
document.body.addEventListener('click', e => {
  if (editingTaskID && !e.target.closest('.task') && !e.target.closest('#strip')) commitEdit();
});

// ---------- sheets ----------
function closeSheets() {
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
}
function openSheet(kind, arg) {
  commitEdit();
  const el = document.getElementById('sheet-' + kind);
  builders[kind](el, arg);
  document.getElementById('overlay').classList.add('show');
  requestAnimationFrame(() => el.classList.add('show'));
}

const builders = {
  lists(el) {
    let h = '<div class="grab"></div><h3>Lists</h3>';
    h += state.lists.map(l =>
      '<button class="row" onclick="pickList(\'' + l.id + '\')">' +
      '<span class="dot" style="background:' + listAccent(l) + '"></span>' + esc(l.name) +
      (l.id === ui.selectedListID ? '<span class="tick">✓</span>' : '') + '</button>'
    ).join('');
    h += '<button class="row subtle" onclick="openEditor(null)">＋ New List…</button>';
    h += '<button class="row subtle" onclick="openEditor(\'' + curList().id + '\')">Edit “' + esc(curList().name) + '”…</button>';
    el.innerHTML = h;
  },
  filter(el) {
    let h = '<div class="grab"></div><h3>Filter by highlight</h3>';
    h += '<button class="row" onclick="setFilter(null)">All Tasks' + (!ui.filter ? '<span class="tick">✓</span>' : '') + '</button>';
    h += Object.keys(HL_COLORS).map(n =>
      '<button class="row" onclick="setFilter(\'' + n + '\')">' +
      '<span class="dot" style="background:' + HL_COLORS[n] + '"></span>' + n +
      (ui.filter === n ? '<span class="tick">✓</span>' : '') + '</button>').join('');
    el.innerHTML = h;
  },
  size(el) {
    const t = curTask(); if (!t) return;
    const cur = t.size || curList().size || 12;
    let h = '<div class="grab"></div><h3>Text size</h3>';
    h += SIZES.map(([n, p]) =>
      '<button class="row" onclick="setTaskSize(' + p + ')">' + n +
      (cur === p ? '<span class="tick">✓</span>' : '') + '</button>').join('');
    el.innerHTML = h;
  },
  highlight(el) {
    const t = curTask(); if (!t) return;
    let h = '<div class="grab"></div><h3>Highlight</h3>';
    h += '<button class="row" onclick="setHighlight(null)">None' + (!t.highlight ? '<span class="tick">✓</span>' : '') + '</button>';
    h += Object.keys(HL_COLORS).map(n =>
      '<button class="row" onclick="setHighlight(\'' + n + '\')">' +
      '<span class="dot" style="background:' + HL_COLORS[n] + '"></span>' + n +
      (t.highlight === n ? '<span class="tick">✓</span>' : '') + '</button>').join('');
    el.innerHTML = h;
  },
  editor(el, listID) {
    const l = listID ? state.lists.find(x => x.id === listID) : null;
    editorTarget = listID;
    editorColor = l ? (l.color || 'Indigo') : Object.keys(LIST_COLORS)[state.lists.length % 8];
    editorSize = l ? (l.size || 12) : 12;
    let h = '<div class="grab"></div><h3>' + (l ? 'Edit List' : 'New List') + '</h3>';
    h += '<input class="field" id="list-name" placeholder="List name" value="' + (l ? esc(l.name).replace(/"/g,'&quot;') : '') + '">';
    h += '<h3>Color</h3><div class="swatches">' + Object.entries(LIST_COLORS).map(([n, c]) =>
      '<button class="swatch' + (n === editorColor ? ' sel' : '') + '" data-color="' + n + '" style="background:' + c + '" onclick="pickSwatch(\'' + n + '\')"></button>').join('') + '</div>';
    h += '<h3>Text size</h3><div class="seg" id="size-seg">' + SIZES.map(([n, p]) =>
      '<button data-pts="' + p + '" class="' + (editorSize === p ? 'sel' : '') + '" onclick="pickSize(' + p + ')">' + n + '</button>').join('') + '</div>';
    h += '<div class="sheet-actions">';
    if (l && state.lists.length > 1) h += '<button class="btn-danger" onclick="confirmDeleteList()">Delete</button>';
    h += '<button class="btn-plain" onclick="closeSheets()">Cancel</button>';
    h += '<button class="btn-primary" onclick="saveEditor()">' + (l ? 'Save' : 'Create') + '</button></div>';
    el.innerHTML = h;
  },
  settings(el) {
    const mode = syncMode();
    let h = '<div class="grab"></div><h3>Sync</h3>';
    if (mode === 'gs') {
      h += '<div class="row subtle" style="border:none">Synced through your Google account.</div>';
    } else {
      h += '<div class="row subtle" style="border:none">Paste your sync link (the Apps Script web app URL):</div>';
      h += '<input class="field" id="sync-url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(syncURL) + '">';
    }
    h += '<div class="row subtle" style="border:none" id="sync-status">' + esc(lastSyncMsg) + '</div>';
    h += '<h3>' + (encryptionOn() ? '🔒 End-to-end encrypted' : 'Encryption') + '</h3>';
    h += '<div class="row subtle" style="border:none">' +
         (encryptionOn()
           ? 'Enter the same passphrase you set on the Mac to unlock on this device.'
           : 'Set a passphrase to encrypt everything before it leaves this device. If lost, the data cannot be recovered.') +
         '</div>';
    h += '<input class="field" id="pass-input" type="password" placeholder="Passphrase" autocomplete="current-password">';
    h += '<button class="row" style="justify-content:center;color:var(--accent);font-weight:bold" onclick="applyPassphrase()">' +
         (encryptionOn() ? 'Unlock' : 'Encrypt My Data') + '</button>';
    h += '<div class="sheet-actions">';
    h += '<button class="btn-plain" onclick="closeSheets()">Close</button>';
    if (mode !== 'gs') h += '<button class="btn-plain" onclick="saveSyncURL()">Save Link</button>';
    h += '<button class="btn-primary" onclick="syncNow(true)">Sync Now</button></div>';
    el.innerHTML = h;
  },
  confirm(el, cfg) {
    el.innerHTML = '<div class="grab"></div><h3>' + esc(cfg.title) + '</h3>' +
      '<div class="sheet-actions"><button class="btn-plain" onclick="closeSheets()">Cancel</button>' +
      '<button class="btn-danger" id="confirm-yes">' + esc(cfg.button) + '</button></div>';
    document.getElementById('confirm-yes').onclick = () => { closeSheets(); cfg.action(); };
  },
};

let editorTarget = null, editorColor = 'Indigo', editorSize = 12;
function pickList(id){ ui.selectedListID = id; selectedTaskID = null; editingTaskID = null; ui.filter = null; closeSheets(); persist(); render(); }
function openEditor(id){ closeSheets(); openSheet('editor', id); }
function pickSwatch(n){ editorColor = n; document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.color === n)); }
function pickSize(p){ editorSize = p; document.querySelectorAll('#size-seg button').forEach(b => b.classList.toggle('sel', +b.dataset.pts === p)); }
function saveEditor() {
  const name = document.getElementById('list-name').value.trim();
  if (!name) return;
  if (editorTarget) {
    const l = state.lists.find(x => x.id === editorTarget);
    if (l) { l.name = name; l.color = editorColor; l.size = editorSize; l.updatedAt = now(); }
  } else {
    const l = { id: uuid(), name, color: editorColor, size: editorSize, todos: [], updatedAt: now() };
    state.lists.push(l);
    ui.selectedListID = l.id;
  }
  closeSheets(); touch();
}
function confirmDeleteList() {
  const l = state.lists.find(x => x.id === editorTarget);
  closeSheets();
  openSheet('confirm', {
    title: 'Delete “' + (l ? l.name : '') + '” and its tasks?',
    button: 'Delete List',
    action() {
      state.tombstones[editorTarget] = now();
      state.lists = state.lists.filter(x => x.id !== editorTarget);
      if (ui.selectedListID === editorTarget) ui.selectedListID = state.lists[0].id;
      touch();
    },
  });
}

// ---------- sync ----------
// ---------- end-to-end encryption (matches the Mac & iPhone apps) ----------
// PBKDF2-SHA256 (200k) -> AES-256-GCM. The stored blob is {enc:{v,salt,iv,ct}}
// and ct is ciphertext||tag, which is exactly what WebCrypto produces.
const ENC_ITERATIONS = 200000;
let vaultKey = null, vaultKeySalt = null;
let passphrase = sessionStorage.getItem('staytop.pass') || localStorage.getItem('staytop.pass') || '';
let needsPassphrase = false;

const b64enc = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function keyFor(saltB64) {
  if (!passphrase) return null;
  if (vaultKey && vaultKeySalt === saltB64) return vaultKey;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  vaultKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64dec(saltB64), iterations: ENC_ITERATIONS, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  vaultKeySalt = saltB64;
  localStorage.setItem('staytop.salt', saltB64);
  return vaultKey;
}

async function decryptState(env) {
  const key = await keyFor(env.salt);
  if (!key) return null;
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(env.iv) }, key, b64dec(env.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  } catch (e) {
    return null;
  }
}

async function encryptState(state) {
  const saltB64 = localStorage.getItem('staytop.salt') || b64enc(crypto.getRandomValues(new Uint8Array(16)));
  const key = await keyFor(saltB64);
  if (!key) return null;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(state)));
  return { enc: { v: 1, salt: saltB64, iv: b64enc(iv), ct: b64enc(ct) } };
}

function setPassphrase(p) {
  passphrase = p;
  vaultKey = null; vaultKeySalt = null;
  localStorage.setItem('staytop.pass', p);
  localStorage.setItem('staytop.encOn', '1');
  needsPassphrase = false;
  syncNow(true);
}
const encryptionOn = () => localStorage.getItem('staytop.encOn') === '1';

function syncMode() {
  if (window.google && google.script && google.script.run) return 'gs';
  if (syncURL) return 'http';
  return 'off';
}
function applyPassphrase() {
  const el = document.getElementById('pass-input');
  const p = (el && el.value || '').trim();
  if (p.length < 6) { lastSyncMsg = 'Passphrase must be at least 6 characters'; refreshSettings(); return; }
  setPassphrase(p);
  closeSheets();
}

function saveSyncURL() {
  syncURL = document.getElementById('sync-url').value.trim();
  localStorage.setItem('staytop.syncURL', syncURL);
  closeSheets(); syncNow(true);
}

function apiGet(cb, err) {
  if (syncMode() === 'gs') {
    google.script.run.withSuccessHandler(cb).withFailureHandler(err).apiGetState();
  } else {
    fetch(syncURL + '?action=state').then(r => r.json()).then(cb).catch(err);
  }
}
function apiSave(body, cb, err) {
  if (syncMode() === 'gs') {
    google.script.run.withSuccessHandler(cb).withFailureHandler(err).apiSaveState(body);
  } else {
    fetch(syncURL, { method: 'POST', body: JSON.stringify(body) })
      .then(r => r.json()).then(cb).catch(err);
  }
}

let pushTimer = null;
function schedulePush() {
  if (syncMode() === 'off') return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => syncNow(false), 1200);
}

function syncNow(manual, attempt) {
  if (syncMode() === 'off') { if (manual) { lastSyncMsg = 'No sync link set'; refreshSettings(); } return; }
  if (syncing) return;
  attempt = attempt || 0;
  syncing = true; render();
  const fail = e => {
    syncing = false;
    lastSyncMsg = 'Error: ' + (e && e.message ? e.message : 'sync failed');
    refreshSettings(); render();
  };
  apiGet(async doc => {
    let remote = doc.state || { lists: [], tombstones: {} };

    // Encrypted vault: decrypt before merging. Without the passphrase we stop
    // here — pushing plaintext would destroy the vault for every device.
    if (remote && remote.enc) {
      const decrypted = await decryptState(remote.enc);
      if (!decrypted) {
        syncing = false;
        needsPassphrase = true;
        lastSyncMsg = passphrase ? 'Wrong passphrase — nothing changed' : 'Locked — enter your passphrase';
        localStorage.setItem('staytop.encOn', '1');
        refreshSettings(); render();
        return;
      }
      remote = decrypted;
      needsPassphrase = false;
      localStorage.setItem('staytop.encOn', '1');
    }

    const merged = merge(state, remote);
    const remoteJSON = JSON.stringify(normalize(remote));
    const mergedJSON = JSON.stringify(normalize(merged));
    state = merged; rev = doc.rev;
    if (!state.lists.length) state.lists = [{ id: uuid(), name: 'Tasks', color: 'Indigo', todos: [], updatedAt: now() }];
    if (!state.lists.some(l => l.id === ui.selectedListID)) ui.selectedListID = state.lists[0].id;
    persist(); render();
    if (mergedJSON === remoteJSON) {
      syncing = false; dirty = false;
      lastSyncMsg = 'Synced ' + new Date().toLocaleTimeString();
      refreshSettings(); render();
      return;
    }

    let payload = state;
    if (encryptionOn()) {
      payload = await encryptState(state);
      if (!payload) {
        syncing = false;
        needsPassphrase = true;
        lastSyncMsg = 'Locked — enter your passphrase';
        refreshSettings(); render();
        return;
      }
    }

    apiSave({ baseRev: rev, state: payload }, res => {
      syncing = false;
      if (res.conflict) {
        if (attempt < 3) { syncNow(manual, attempt + 1); return; }
        lastSyncMsg = 'Error: repeated conflicts';
      } else {
        rev = res.rev; dirty = false;
        lastSyncMsg = 'Synced ' + new Date().toLocaleTimeString();
      }
      persist(); refreshSettings(); render();
    }, fail);
  }, fail);
}
function refreshSettings() {
  const s = document.getElementById('sync-status');
  if (s) s.textContent = lastSyncMsg;
}

// ---------- merge (mirrors the Mac app) ----------
function normalize(s) {
  return { lists: (s.lists || []).map(l => ({ ...l, todos: l.todos || [] })), notes: s.notes || [], tombstones: s.tombstones || {} };
}
function merge(a, b) {
  a = normalize(a); b = normalize(b);
  const tombs = { ...a.tombstones };
  for (const [id, ts] of Object.entries(b.tombstones)) {
    if (!tombs[id] || tombs[id] < ts) tombs[id] = ts;
  }
  const cutoff = now() - 45 * 24 * 3600 * 1000;
  for (const id of Object.keys(tombs)) if (tombs[id] < cutoff) delete tombs[id];

  const byIdB = Object.fromEntries(b.lists.map(l => [l.id, l]));
  const seen = new Set();
  const lists = [];
  for (const la of a.lists) {
    if (tombs[la.id]) continue;
    seen.add(la.id);
    const lb = byIdB[la.id];
    lists.push(lb ? mergeList(la, lb, tombs) : la);
  }
  for (const lb of b.lists) {
    if (seen.has(lb.id) || tombs[lb.id]) continue;
    lb.todos = (lb.todos || []).filter(t => !tombs[t.id]);
    lists.push(lb);
  }

  // Notes: same LWW merge so this page never drops them
  const byIdBN = Object.fromEntries(b.notes.map(n => [n.id, n]));
  const seenN = new Set();
  const notes = [];
  for (const n of a.notes) {
    if (tombs[n.id]) continue;
    seenN.add(n.id);
    const o = byIdBN[n.id];
    notes.push(o && (o.updatedAt || 0) > (n.updatedAt || 0) ? o : n);
  }
  for (const n of b.notes) {
    if (seenN.has(n.id) || tombs[n.id]) continue;
    notes.push(n);
  }

  return { lists, notes, tombstones: tombs };
}
function mergeList(a, b, tombs) {
  const newer = (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a;
  const out = { id: a.id, name: newer.name, color: newer.color, size: newer.size, updatedAt: newer.updatedAt };
  const byIdA = Object.fromEntries((a.todos || []).map(t => [t.id, t]));
  const byIdB = Object.fromEntries((b.todos || []).map(t => [t.id, t]));
  const order = (newer === b ? b : a).todos || [];
  const other = (newer === b ? a : b).todos || [];
  const seen = new Set();
  const todos = [];
  for (const t of order) {
    if (tombs[t.id]) continue;
    seen.add(t.id);
    const ta = byIdA[t.id], tb = byIdB[t.id];
    if (ta && tb) todos.push((tb.updatedAt || 0) > (ta.updatedAt || 0) ? tb : ta);
    else todos.push(t);
  }
  for (const t of other) {
    if (seen.has(t.id) || tombs[t.id]) continue;
    todos.push(t);
  }
  out.todos = todos;
  return out;
}

// ---------- boot ----------
render();
syncNow(false);
setInterval(() => { if (dirty) syncNow(false); else syncNow(false); }, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncNow(false);
});
</script>
